# minact project configuration.
#
# Copy to `.minact/config.yml` in your project, or pass it with
# `minact run --config examples/config.yml`.
#
# The `runners:` section maps `runs-on:` labels to real places to run.
#
# Without this file every job runs on your machine, and a `runs-on:` naming a
# platform you are not on is reported as a warning rather than silently
# ignored. This file is how you make those labels mean something.

runners:
  # A container: real Linux, on any host. This is the one that closes the
  # biggest gap — building Linux artifacts from a Mac.
  ubuntu-latest:
    type: docker
    image: ubuntu:24.04

  ubuntu-22.04:
    type: docker
    image: ubuntu:22.04

  # Pin the architecture when the artifact has to match a specific one,
  # rather than inheriting your host's.
  ubuntu-x64:
    type: docker
    image: ubuntu:24.04
    run-args: ["--platform", "linux/amd64"]
    # Fetch the image instead of relying on a local copy.
    pull: true

  # An image with your toolchain already in it beats installing it per run.
  android:
    type: docker
    image: ghcr.io/cirruslabs/android-sdk:34
    user: root

  # This machine. Name it explicitly to say "yes, host is correct here" and
  # silence the fallback warning.
  macos-latest:
    type: local

  self-hosted:
    type: local

  # Another machine, for what containers cannot give you: Windows, or real
  # macOS hardware for signing and notarisation.
  #
  # The workspace is pushed before the job and pulled back after, so artifacts
  # the remote produces land in your local workspace — with rsync when both
  # ends have it, as a tar stream otherwise. Requires key-based SSH login that
  # already works non-interactively.
  #
  # A Windows machine needs nothing but OpenSSH Server and Git for Windows:
  # minact finds Git Bash next to git.exe and runs the job through it, so
  # `shell: bash` and `shell: pwsh` steps both work and `runner.os` is
  # `Windows` while the job is there.
  windows-latest:
    type: ssh
    host: win-builder.local
    user: builder
    # `~` is the remote user's home; `C:/minact/workspace` works too.
    remote-workspace: ~/minact-workspace
    # Not worth sending to a build box, in either direction.
    exclude: [target, node_modules, .git]
    # Where Git Bash is, when it is not next to the `git.exe` on PATH.
    # shell: D:/tools/Git/bin/bash.exe

  mac-signer:
    type: ssh
    host: mac-mini.local
    user: ci
    port: 22
    identity-file: ~/.ssh/id_ed25519
    remote-workspace: /Users/ci/minact-workspace
    # Turn sync off when the remote already has the tree, e.g. a shared
    # checkout it updates itself.
    sync: true
